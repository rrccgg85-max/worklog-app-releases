name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: '' # ปิด cache ไม่ให้ติด error 400 จาก github cache service

      - name: Prepare Keystore & Permissions
        run: |
          chmod +x gradlew
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkLog-APK
          path: app/build/outputs/apk/debug/*.apk
