name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Gradle Wrapper
        run: |
          chmod +x gradlew
          # ถ้า gradle-wrapper.jar เสียหาย ให้ download ใหม่
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "gradle-wrapper.jar is corrupt, downloading fresh..."
            GRADLE_VERSION=$(grep "distributionUrl" gradle/wrapper/gradle-wrapper.properties | grep -oP '\d+\.\d+(\.\d+)?')
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O gradle-dist.zip
            unzip -q gradle-dist.zip
            cp gradle-${GRADLE_VERSION}/lib/gradle-launcher-*.jar gradle/wrapper/gradle-wrapper.jar
            rm -rf gradle-dist.zip gradle-${GRADLE_VERSION}
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkLog-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
