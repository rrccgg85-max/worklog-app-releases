name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Prepare Keystore & Permissions
        run: |
          chmod +x gradlew
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace --info

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorkLog-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Show Build Logs on Failure
        if: failure()
        run: |
          echo "=== DUMPING GRADLE BUILD LOGS ==="
          find . -name "*.log" -path "*/build/*" | xargs tail -n 100 2>/dev/null || true
          cat app/build/outputs/logs/*.log 2>/dev/null || true
          find app/build/reports -name "*.txt" 2>/dev/null | xargs cat 2>/dev/null || true
